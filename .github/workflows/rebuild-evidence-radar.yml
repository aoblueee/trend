name: Rebuild evidence-based Trend Radar
on:
  push:
    paths:
      - '.github/workflows/rebuild-evidence-radar.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current-month evidence sets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          aug="""[{n:'Setlog',c:'SNS / Apps',s:97,w:'🚀 BREAKOUT → 高浸透',v:[25,20,19,15,10,8],e:'【SURVEY● PLATFORM● BEHAVIOR● MEDIA●】全国15〜24歳4,729人のLINEリサーチで6月総合4位に初登場し、女性15〜18歳・19〜22歳では3位。7月後半の学生479人調査では認知91.4%、利用73.7%、利用者の93.1%が3か月以内に開始。さらに8/10〜16のApp Store無料iPhone週間チャート2位、App Storeソーシャルネットワーキング1位。複数の独立した観測で「若年女性先行→実利用・DL」まで確認できるためMAIN最上位。',l:[['LINEリサーチ n=4,729','https://note.com/linesurveys_jp/n/n0ba6dfe47563'],['8月利用実態 n=479','https://prtimes.jp/main/html/rd/p/000000102.000033964.html'],['App Store','https://apps.apple.com/jp/app/setlog/id6587576438'],['週間App Storeチャート','https://www.oricon.co.jp/rank/faa/w/2026-08-17/']]},{n:'シール交換 / シール帳',c:'Character / Goods',s:94,w:'🔥 MAIN / 高止まり',v:[20,20,19,14,10,11],e:'【SURVEY● SOCIAL● CONSUMPTION● RETAIL●】高校生夏調査でシール交換1位、LINEリサーチ15〜24歳でも3月から6月まで「シール集め」がTOP10継続。15〜29歳調査でもボンボンドロップシール・シール帳が上位。8月も東京都内で具体的な入荷・目撃情報が継続しており、単一調査ではなく「調査横断＋購買行動」で波を確認。ただし急上昇期より成熟したためMomentumは抑制。',l:[['高校生夏トレンド','https://shibuya-trendresearch.jp/monthlytrendsurvey/4480/'],['LINEリサーチ','https://note.com/linesurveys_jp/n/n0ba6dfe47563'],['15〜29歳調査','https://www.oricon.co.jp/pressrelease/2914206/'],['8月東京目撃情報','https://www.seal-search.com/prefecture/sight-info-weekly-tokyo/']]},{n:'M!LK / 「○○すぎて滅」',c:'Culture / Language',s:93,w:'🔥 CROSSOVER',v:[20,20,20,15,9,9],e:'【SURVEY● UGC● CHART● VIDEO●】LINEリサーチでM!LKは上半期TOP2圏内、10代女子・αZ・小中学生の別調査でも「○○すぎて滅」やM!LKが首位級。さらに8/7〜13 YouTube週間チャートで「好きすぎて滅！」が445.6万回で1位へ返り咲き、8/10〜16のBillboard UGCでも1位。上半期人気の惰性ではなく8月にも再加速を確認。',l:[['LINEリサーチ','https://note.com/linesurveys_jp/n/n0ba6dfe47563'],['10代女子調査','https://gakumado.mynavi.jp/teens/articles/88881'],['αZ調査','https://prtimes.jp/main/html/rd/p/000000116.000020799.html'],['8月YouTubeチャート','https://www.oricon.co.jp/news/2474775/full/'],['Billboard UGC 8/19','https://magazine.tunecore.co.jp/news/665831/']]},{n:'EBiDAN「Yes! 東京」',c:'Video / Streaming',s:91,w:'🚀 NEW BREAKOUT',v:[25,18,18,15,8,7],e:'【SALES● STREAMING● UGC● CHART●】8/11発売後、初週CD131.3万枚で週間1位かつ2026年累計最多。8/19 Hot 100総合1位、ストリーミング3位。Hot Shot SongsではM!LK版・原因は自分にある。版・超特急版が1〜3位、UGC合同版も前週67位→2位。売上だけでなくストリーミング・UGCまで同時上昇しているため新規MAIN。',l:[['Hot 100','https://tvfan.kyodo.co.jp/music/news-music/1522191'],['Hot Shot Songs','https://magazine.tunecore.co.jp/news/665835/'],['UGC','https://magazine.tunecore.co.jp/news/665831/'],['週間セールス','https://tvfan.kyodo.co.jp/music/news-music/1522004']]},{n:'めじるしアクセサリー / チャーム',c:'Character / Goods',s:85,w:'🌱 上昇→定着',v:[18,18,17,13,9,10],e:'【SURVEY● SURVEY● PRODUCT●】高校生夏調査で4位、全国15〜24歳4,729人のLINEリサーチでも6月14位へ急上昇。10〜20代女性1,000人調査でもモノコト上位に観測され、複数パネルで一致。ガチャ新作供給も継続しているが、8月の新たな加速を示す販売データは弱いため85に留める。',l:[['高校生夏トレンド','https://shibuya-trendresearch.jp/monthlytrendsurvey/4480/'],['LINEリサーチ','https://note.com/linesurveys_jp/n/n0ba6dfe47563'],['Trepo n=1,000','https://news.mynavi.jp/article/20260601-4529839/'],['ガシャポン発売予定','https://gashapon.jp/schedule/']]},{n:'ボンボンドロップシール',c:'Character / Goods',s:84,w:'🔥 PRODUCT HEAT / 成熟',v:[16,20,17,13,9,9],e:'【SURVEY● RETAIL● SCARCITY● PRODUCT●】LINEリサーチ3月3位、15〜29歳調査では流行アイテム1位。8月にもドラえもん新作で完売・転売懸念が報じられ、抽選・入荷情報が継続。商品単体の購買熱はまだ強いが、文化全体は成熟局面なので「シール交換」より下位。',l:[['LINEリサーチ3月','https://note.com/linesurveys_jp/n/nd5988102f109'],['15〜29歳調査','https://www.oricon.co.jp/pressrelease/2914206/'],['8月新作・完売懸念','https://magmix.jp/post/369341'],['入荷・抽選動向','https://bondro-news.com/']]},{n:'フレネミー',c:'Culture / Language',s:81,w:'🌱 YOUTH SIGNAL',v:[21,20,14,11,7,8],e:'【SURVEY● SURVEY● SOCIAL●】αZ総研の上半期調査で流行語3位、7月実施の中高生街頭調査では流行語1位。「フレネミーあるある」として高校生〜大学生のSNS文脈でも観測。複数若者パネルで一致する一方、検索・消費のような別系統データはまだ薄いためMAIN下位に限定。',l:[['αZ総研','https://prtimes.jp/main/html/rd/p/000000116.000020799.html'],['中高生7月調査','https://alpha-gen-lab.com/news/XCgNsL9s'],['ABEMA解説','https://times.abema.tv/articles/-/10262164']]}]"""
          early_aug="""[['AIイラスト','15〜29歳600人の下半期ネクスト予測1位。ただし「予測調査」中心で、8月現在の独立した利用・検索急増をまだ十分確認できないためMAINには上げずEARLY。'],['GG EZ / AI生成楽曲×ダンス','AI技術で制作されたM.Sasuke「GG EZ」が7月からBillboard Heatseekers首位を重ね、8/19も5位。TikTokダンス起点の実データは強い。単曲ヒットから「AI生成音楽」全体へ広がるか監視。'],['天女界隈','8月のSHIBUYA109 lab.分析会議・テレビ露出で浮上。ただし現時点では同一観測系統からの情報が中心。SNS投稿量・検索・購買の独立シグナルを確認するまでMAINには置かない。'],['ジェリーバッグ / ジェリーシューズ','若者会議で浮上しPUMAなど商品投入も確認。ただし「若者全体の流行」と言える独立データはまだ不足。Shopping側で具体商品を追いつつEARLY監視。'],['ランジェリーコア / 2016リバイバル','若者会議で先行シグナル。平成・2010年代再編集の大きな流れとの整合性はあるが、単一ソース依存のためEARLY。'],['お菓子帳','小中学生調査でネクストバズ候補。シール交換の「収集・交換・見せる」行動が菓子パッケージへ派生するかを監視。'],['ワホー（SEIKINミーム再燃）','LINEリサーチ6月で初登場7位、WE LABOでも複数界隈に観測。11年前の動画切り抜き再燃というREVIVAL型。8月の再加速確認待ち。'],['伊能忠敬界隈','15〜29歳600人の下半期ネクスト予測上位、上半期の複数若者メディアでも観測。長距離歩行をネタ化する「界隈ミーム」が体験行動へ広がるか監視。'],['ファッションスピ / スピ活','8月の若者分析会議で浮上。神社・御朱印・お守りをライトに楽しむ行動は興味深いが、現状はソース多様性不足のためEARLY。']]"""
          shops_aug="""[{n:'Urumia × 矢沢あい Heroine Collection',signal:'🚀 BREAKOUT',sub:'NANA / ご近所物語 / 天使なんかじゃない / Paradise Kiss 全5色',cat:'Beauty',s:96,status:'HOT',price:'10枚 ¥1,870',release:'8/19 POPUP開始',disc:1,e:'【OFFICIAL● SALES● SOCIAL● EVENT●】公式オンラインで5箱・10箱セットがSold Out。8/19ラフォーレ原宿POPUPでは来場者投稿で約2時間待ちが複数観測され、8/20公開の紹介Shortsも約15万再生。発売情報だけでなく実売・行列・UGCまで確認できるためHOT NOW最上位。',l:[['公式商品・Sold Out','https://urumia.com/'],['公式コラボ情報','https://prtimes.jp/main/html/rd/p/000000036.000096388.html'],['Xリアルタイム反応','https://search.yahoo.co.jp/realtime/search?ei=UTF-8&p=%23%E7%9F%A2%E6%B2%A2%E3%81%82%E3%81%84&save=5'],['Shorts反応','https://yutura.net/channel/55207/latest/']]},{n:'ボンボンドロップシール ドラえもん / 藤子・F・不二雄キャラクターズ',signal:'🆕 NEW / 🔥 SCARCITY',sub:'8/14発売の新作2種',cat:'Goods',s:92,status:'HOT',price:'各商品価格',release:'8/14',e:'【SURVEY● PRODUCT● SCARCITY● RETAIL●】大きなシールブームの中で8/14発売の具体新作。発売前から完売・転売懸念が報じられ、8月も入荷・抽選情報が活発。Shoppingでは抽象的な「ボンドロ」ではなく今動くSKUとして計上。',l:[['新作情報','https://magmix.jp/post/369341'],['入荷・抽選動向','https://bondro-news.com/'],['若者調査','https://note.com/linesurveys_jp/n/nd5988102f109']]},{n:'rom&nd 豆乳エディション 42 ソイフィグ',signal:'🔮 PRE-LAUNCH',sub:'ザ ジューシーラスティングティント限定色',cat:'Beauty',s:91,status:'PRE',price:'¥1,320',release:'8/28先行 / 9/11全国',disc:1,e:'【OVERSEAS SALES● MEDIA● RETAIL● OFFICIAL●】韓国Qoo10公式で豆乳エディション全体が発売1週間約42,000個。日本では8/28にLOFT・PLAZA・@cosme先行、数量限定。単なる新作ではなく海外実売→日本発売直前というPre-launch需要を評価。',l:[['韓国実売・日本発売','https://prtimes.jp/main/html/rd/p/000000373.000076505.html'],['@cosme商品情報','https://www.cosme.net/variations/1256625/'],['WWD','https://www.wwdjapan.com/articles/2442692']]},{n:'rom&nd ジューシーフラッシュリップオイル 11 ソイミルク',signal:'🔮 PRE-LAUNCH',sub:'豆乳エディション限定色',cat:'Beauty',s:89,status:'PRE',price:'¥1,485',release:'8/28先行 / 9/11全国',e:'豆乳エディションの中でも「具体的に何を買うか」が分かるSKUとして掲載。グレーモーヴベージュの限定色。シリーズ全体の韓国実売42,000個を需要先行指標とし、日本での実売は発売後に再評価。',l:[['@cosme商品情報','https://www.cosme.net/variations/1256633/'],['韓国実売・日本発売','https://prtimes.jp/main/html/rd/p/000000373.000076505.html']]},{n:'ANGEL BLUE × サンキューマート シールバインダー',signal:'♻️ REVIVAL / 🔮 PRE-LAUNCH',sub:'平成女児×現在のシール文化',cat:'Goods',s:87,status:'PRE',price:'¥429',release:'9月上旬 / 8/6予約開始',disc:1,e:'【OFFICIAL● PRIOR DEMAND● CULTURE FIT●】全17商品の新コレクション。2024年コラボの大反響を受けた再展開で、今回は現在のシール交換ブームと直結するシールバインダーを具体SKUとして選定。予約上限あり。発売後の売切れ・SNS反応で昇降する。',l:[['サンキューマート公式','https://thankyoumart.jp/blogs/news/angelblue'],['発表','https://prtimes.jp/main/html/rd/p/000000794.000002319.html']]},{n:'PUMA Speedcat Ballet Jelly',signal:'✨ DISCOVERY',sub:'ジェリー素材×バレエスニーカー',cat:'Fashion',s:76,status:'HOT',price:'¥12,100',release:'8/13',disc:1,e:'【PRODUCT● TREND-FIT●】8月のジェリー系先行シグナルとバレエスニーカーを結ぶ具体商品。ただし現時点で独立した売切れ・UGC急増を十分確認できないため前回93から大幅減点。Discoveryとして監視し、需要データが出なければ次回除外。',l:[['PUMA公式','https://jp.puma.com/jp/ja/launch-calendar'],['若者トレンド分析','https://newsdig.tbs.co.jp/articles/-/2848838?page=2']]},{n:'サンリオキャラクターズ くだものめじるしアクセサリー',signal:'🆕 NEW',sub:'全5種',cat:'Character',s:78,status:'HOT',price:'¥300',release:'8月第2週',local:1,e:'【SURVEY● PRODUCT●】めじるしアクセサリー自体は複数若者調査で確認済み。Shoppingでは8月の具体新作として掲載。ただしこのSKU単体の販売熱は未確認なのでスコアを抑え、錦糸町・両国は公式在庫確認が取れた時だけ更新。',l:[['ガシャポン公式','https://gashapon.jp/schedule/'],['高校生夏調査','https://shibuya-trendresearch.jp/monthlytrendsurvey/4480/'],['LINEリサーチ','https://note.com/linesurveys_jp/n/n0ba6dfe47563']]}]"""
          music_aug="""[['好きすぎて滅！','M!LK'],['Yes! 東京 (feat. EBiDAN)','EBiDAN'],['Brand New','Mrs. GREEN APPLE'],['This & That','Stray Kids'],['JANE DOE','米津玄師, 宇多田ヒカル'],['Toyfriend','SB19 & BE:FIRST'],['島のうた (セイレーンver.)','セイレーン・人魚'],['GG EZ','M.Sasuke'],['モンストロ','Ado'],['セツナハナビ (Setsuna Hanabi)','TOMORROW X TOGETHER']]"""
          analysis_aug="""[['MAINを全面再審査','今週からMAINは「若者調査に載った」だけでは昇格させない。原則としてSurvey / Social・UGC / Search / Consumption / Platform・Chart / Freshnessのうち独立した複数系統で現在の波を確認する。結果、天女界隈・穴あけパンチ加工・ファッションスピ・おかず系かき氷・山手線一周など、単一の分析会議への依存が大きかった項目はMAINからEARLYまたは除外へ戻した。'],['今週もっとも強い「実行動」はSetlog','Setlogは大規模若者調査、利用実態、App Store週間2位・SNSカテゴリ1位が一致。話題だけでなくダウンロードと日常利用まで転換しており、現在のMAINとして最も確度が高い。'],['シールは「急上昇」から巨大な高止まりへ','複数の独立した若者調査と8月の入荷・抽選行動から、ブーム自体はまだ強い。ただし春ほどの新規加速ではないため、シール交換をMAIN上位に残しつつMomentumは減点。ボンボンドロップは商品熱として別評価する。'],['音楽・言葉・アイドルが一つの波になる','M!LK「好きすぎて滅！」は半年以上続くが、8月にYouTube1位へ返り咲き、UGCも1位。「○○すぎて滅」という言葉は複数の10代・αZ調査で首位級。さらにEBiDAN「Yes! 東京」はCD131万枚だけでなくストリーミング・UGCも同時上昇し、今週の新規Breakoutとなった。'],['EARLYは「面白い」だけでMAINにしない','天女界隈、ジェリー系、ランジェリーコア、ファッションスピなどは発見価値が高い。一方で同じ調査会議・メディア露出を相互独立ソースと誤認しない。SNS量、検索、購買、別パネル等が追随した時にMAINへ昇格させる。'],['Source Diversityを採点の前提へ','Evidence内にSURVEY / SOCIAL・UGC / PLATFORM・CHART / CONSUMPTION・RETAIL / PRODUCT等の観測系統を明記。記事転載を「別ソース」と数えず、元データが同じ場合は一つの観測として扱う。']]"""
          s=re.sub(r"const aug=\[.*?\];const early=", "const aug="+aug+";const early=", s, flags=re.S)
          s=re.sub(r"aug:\[\['ランジェリーコア'.*?\]\};const shopCats=", "aug:"+early_aug+"};const shopCats=", s, flags=re.S)
          s=re.sub(r"],aug:\[\{n:'Urumia × 矢沢あい Heroine Collection'.*?\]\};const music=", "],aug:"+shops_aug+"};const music=", s, flags=re.S)
          s=re.sub(r"aug:\[\['Yes! 東京 \(feat\. EBiDAN\)'.*?\]\};const analysis=", "aug:"+music_aug+"};const analysis=", s, flags=re.S)
          s=re.sub(r"aug:\[\['「大流行」より「変化の速さ」で順位が入れ替わる'.*?\]\};let month=", "aug:"+analysis_aug+"};let month=", s, flags=re.S)
          s=s.replace('公開調査・公式発売情報・販売シグナルを横断評価。最終更新 2026/8/23。','Survey / Social・UGC / Platform・Chart / Consumption・Retail / Officialを独立観測として横断。転載記事は別ソースに数えません。最終更新 2026/8/23。')
          s=s.replace('Totalの直下に前月比を表示。各カードの根拠・URLまで維持。','MAINは独立した複数系統の現在シグナルを原則必須化。単一調査の面白い候補はEarlyへ。Totalの直下に前月比を表示。')
          s=s.replace('<div class="method"><h3>Local Status</h3><p>全国発売日から店舗入荷日は推測しない。</p></div>','<div class="method"><h3>Source Diversity Gate</h3><p>MAINは原則、Survey / Social・UGC / Search / Consumption / Platform・Chart等の独立した複数系統で確認。転載記事は同一ソースとして数える。</p></div><div class="method"><h3>MAIN / EARLY</h3><p>面白さだけではMAINにしない。複数観測で波を確認できればMAIN、先行性は高いが証拠が単線ならEARLY。</p></div><div class="method"><h3>Local Status</h3><p>全国発売日から店舗入荷日は推測しない。</p></div>')
          required=['const jul=','const aug=','Trend History','Early Signal','Shopping Radar','Music Radar','Monthly Analysis','Appendix','document.getElementById']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing '+repr(missing))
          if '天女界隈\',c:\'Fashion / Beauty\',s:91' in s: raise SystemExit('old MAIN remained')
          if 'Urumia × 矢沢あい Heroine Collection' not in s or 'Setlog' not in s: raise SystemExit('new data missing')
          p.write_text(s)
          PY
      - name: Basic JS and preservation checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count("const jul=")==1 and s.count("const aug=")==1
          assert '2026年7月 REAL' in s and '2026年8月 REAL' in s
          assert all(x in s for x in ['id="ranking"','id="categories"','id="history"','id="early"','id="shopping"','id="music"','id="analysis"','id="appendix"'])
          print('preservation checks passed', len(s))
          PY
      - name: Commit rebuilt radar
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Rebuild MAIN with cross-source evidence" || exit 0
          git push
