:1,e:'カテゴリ人気は強いが、このSKU単体の8月最終週販売熱は未確認。78→75。',l:[['ガシャポン公式','https://gashapon.jp/schedule/']]}]"""
          music_aug="""{japan:[['セツナハナビ (Setsuna Hanabi)','TOMORROW X TOGETHER','🚀 BREAKOUT','TRAVEL'],['Yes! 東京 (feat. EBiDAN)','EBiDAN','🔥 HOT','UPBEAT'],['好きish','AKB48','🆕 NEW','UPBEAT'],['show time...','Snow Man','🚀 BREAKOUT','FASHION'],['灰色','大森元貴','🚀 BREAKOUT','MOODY'],['爆裂愛してる','M!LK','🚀 BREAKOUT','UPBEAT'],['好きすぎて滅！','M!LK','🔥 HOT','UPBEAT'],['Brand New','Mrs. GREEN APPLE','🔥 HOT','VLOG'],['JANE DOE','米津玄師, 宇多田ヒカル','🔥 HOT','MOODY'],['This & That','Stray Kids','🔥 HOT','UPBEAT']],global:[['Dai Dai','Shakira, Burna Boy','🔥 HOT','TRAVEL'],['Earrings','Malcolm Todd','🚀 BREAKOUT','VLOG'],['Loser','Tame Impala','🚀 BREAKOUT','AESTHETIC'],['Boston','STELLA LEFTY','🚀 BREAKOUT','TRAVEL'],['hate that i made you love me','Ariana Grande','🔥 HOT','MOODY'],['So Easy (To Fall In Love)','Olivia Dean','🔥 HOT','AESTHETIC'],['Animal','KATSEYE','🚀 BREAKOUT','FASHION'],['petal','Ariana Grande','🔥 HOT','AESTHETIC'],['Stateside + Zara Larsson','PinkPantheress, Zara Larsson','🔥 HOT','FASHION'],['Risk It All','Bruno Mars','🔥 HOT','TRAVEL']],early:[['FREAKED OUT','Fat Papi, prodshushy','✨ EARLY','UPBEAT'],['End of August','Noah Kahan','✨ EARLY','TRAVEL'],['Landslide','Fleetwood Mac','♻️ REVIVAL','MOODY'],['Gut Genug','KITSCHKRIEG, Blumengarten, Shirin David','✨ EARLY','AESTHETIC'],['Movin’ to the Sun','HUGEL, Imael Angel, Ultra Naté','✨ EARLY','TRAVEL']]}"""
          analysis_aug="""[['8月最終週は「巨大ヒット」と「今週の伸び」を分離','映画ちいかわ・トモコレは巨大な実消費を維持する一方、今週の新規加速は限定的。規模の強さでMAINを維持しつつ、Momentumは下げてPeak/Coolingを明示した。'],['シール文化は商品側で再点火','文化全体は成熟局面だが、8/14ドラえもん限定ボンボンドロップが売切れ後に定価の約8倍で二次流通成立。8/29には前髪クリップ新柄12種も登場し、熱がSKUと派生カテゴリへ移っている。'],['音楽は「市場を二枚に分ける」ことで解像度が上がった','JAPANは8/17〜23集計のBillboard JAPANとYouTube Japanを重視し、TXT・EBiDAN・Snow Man・大森元貴・M!LKなど直近の動きを反映。GLOBALはBillboard Global、Spotify Global、TikTok系UGCを独立観測し、日本の知名度を条件にしない。'],['Globalでは大ヒットとUGC先行を分離','Dai DaiはBillboard Global 200で6週首位、Spotify GlobalではEarrings・Loser・Dai Daiが最上位圏。一方FREAKED OUT、End of August、Landslide等はTikTok利用文脈が先行しておりEARLY WAVESとして分離した。'],['EARLYは昇格を急がない','パペットスンスンは細野晴臣とのYouTube Music Weekendコラボで露出の質が上がったが、購買・利用の新規急増が確認できるまではEarlyに残す。Mellojoyも同様に上半期実績と8月末Momentumを分けて判断する。']]"""
          s=s.replace('最終更新 2026/8/23。','最終更新 2026/8/30。')
          s=re.sub(r"const aug=\[.*?\];const early=", 'const aug='+aug+';const early=', s, count=1, flags=re.S)
          m=re.search(r"const early=\{jul:(\[.*?\]),aug:\[.*?\]\};const shopCats=",s,re.S); assert m
          s=s[:m.start()]+'const early={jul:'+m.group(1)+',aug:'+early_aug+'};const shopCats='+s[m.end():]
          m=re.search(r"const shops=\{jul:(\[.*?\]),aug:\[.*?\]\};const music=",s,re.S); assert m
