name: One-off September Trend Radar update v2
on:
  push:
    paths:
      - '.github/workflows/oneoff-trend-sep-update-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write updated index
        shell: bash
        run: |
          cat .trend-payload/01.txt .trend-payload/02.txt .trend-payload/03.txt .trend-payload/04.txt .trend-payload/05.txt | base64 -d > /tmp/trend-index.xz
          xz -dc /tmp/trend-index.xz > index.html
      - name: Validate page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['id="ranking"','id="categories"','id="history"','id="early"','id="shopping"','id="music"','id="analysis"','id="appendix"','data-month="sep"','data-month="aug"','data-month="jul"','GLOBAL MUSIC RADAR','EARLY WAVES','document.getElementById']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing: '+repr(missing))
          js=re.search(r'<script>(.*)</script>',s,re.S).group(1)
          Path('/tmp/trend.js').write_text(js)
          print('validation markers OK')
          PY
          node --check /tmp/trend.js
      - name: Commit update and cleanup staging files
        shell: bash
        run: |
          rm -rf .trend-payload
          rm -f .github/workflows/oneoff-trend-sep-update.yml .github/workflows/oneoff-trend-sep-update-v2.yml
          git config user.name 'Trend Radar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh Trend Radar for September 6, 2026'
          git push origin HEAD:main
